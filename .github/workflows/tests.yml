name: tests

on:
  push:
    branches: [master, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # numpy se usa en el núcleo pero aún no está declarado (H-05, intervención I-1.1).
      - run: python -m pip install -e ".[dev]" numpy
      - run: python -m pytest -rA -q
