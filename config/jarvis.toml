[assistant]
name = "Mark"
language = "es"

[llm]
provider = "llama_cpp"
base_url = "http://127.0.0.1:8080/v1"
model = "qwen3-8b-q4_k_m"
context_tokens = 8192
max_output_tokens = 1024
temperature = 0.2
think = false
max_tool_rounds = 6
request_timeout_seconds = 180

[llama_cpp]
executable = "runtime\\llama.cpp-b11459-cuda12.4\\llama-server.exe"
model_path = "models\\Qwen3-8B-Q4_K_M.gguf"
auto_start = true
startup_timeout_seconds = 120
gpu_layers = "auto"
fit_target_mib = 1024
log_verbosity = 3
batch_size = 512
ubatch_size = 128
flash_attention = true

[embeddings]
provider = "llama_cpp"
base_url = "http://127.0.0.1:8081/v1"
model = "qwen3-embedding-0.6b-q8_0"
model_path = "models\\Qwen3-Embedding-0.6B-Q8_0.gguf"
auto_start = true
startup_timeout_seconds = 60
context_tokens = 2048
gpu_layers = 0
batch_size = 2048
dimensions = 1024

[rag]
chunk_chars = 1200
chunk_overlap_chars = 160
max_document_bytes = 10485760
vector_scan_limit = 20000
default_top_k = 6
excluded_path_parts = [".git", ".venv*", "*.egg-info", ".pytest_cache", "node_modules", "benchmarks", "data", "models", "runtime"]

[audio]
input_device = "wasapi_default"
output_device = "wasapi_default"
sample_rate = 16000
min_record_seconds = 0.25
max_record_seconds = 30.0
min_rms = 0.003
call_speech_rms = 0.008
call_voice_start_seconds = 0.12
call_end_silence_seconds = 0.8
call_rollover_seconds = 8.0

[stt]
provider = "faster_whisper"
model_path = "models\\faster-whisper-small"
language = "es"
compute_type = "int8"
cpu_threads = 8
beam_size = 5
vad_filter = true
initial_prompt = "Mark Scout, Mark, JarvisLocal, Qwen3, llama.cpp, SQLite, Git, Windows, PowerShell. Español colombiano."
hotwords = "Mark Mark Scout JarvisLocal Qwen3 llama.cpp SQLite Git README Markdown PowerShell Windows"
min_language_probability = 0.60
min_average_log_probability = -1.0

# Qwen3-TTS Base CUDA es la voz elegida después de una comparación audible con
# la referencia local. Piper, Chatterbox y XTTS permanecen como fallbacks.
[tts]
provider = "qwen3_tts"
voice_path = "models\\piper\\es\\es_MX\\ald\\medium\\es_MX-ald-medium.onnx"
config_path = "models\\piper\\es\\es_MX\\ald\\medium\\es_MX-ald-medium.onnx.json"
language = "es-MX"
speed = 1.0
volume = 0.9

# Backend activo de clonación. Falla cerrado hasta crear el entorno, descargar
# el modelo exacto y enrolar explícitamente una voz autorizada.
[voice_clone]
python = ".venv-qwen3-tts\\Scripts\\python.exe"
model_path = "models\\qwen3-tts-12hz-0.6b-base"
model_file = "t3_es_mx_latam.safetensors"
reference_path = "data\\voices\\user\\reference-qwen.mp3"
reference_text_path = "data\\voices\\user\\reference.txt"
consent_path = "data\\voices\\user\\consent-qwen.json"
device = "cuda"
# Autorización explícita del propietario para compartir la RTX con la voz.
# Si se desactiva, Mark vuelve de forma segura a Piper en CPU.
allow_gpu = true
timeout_seconds = 240
exaggeration = 0.35
cfg_weight = 0.5
# Perfil conservador aprobado auditivamente con el mismo texto que fallaba con
# los defaults 0.9/50/1.0 del modelo oficial.
temperature = 0.65
top_k = 30
top_p = 0.9
subtalker_temperature = 0.65
subtalker_top_k = 30
subtalker_top_p = 0.9
# Semilla aprobada para evitar que el muestreo cambie el timbre entre turnos.
seed = 42

[storage]
data_dir = "data"
database = "jarvis.db"

[security]
allowed_roots = [
  "C:\\Users\\andcb\\Documents\\AI Local",
  "C:\\Users\\andcb\\Documents\\Playground",
]
denied_path_parts = [
  ".ssh",
  ".gnupg",
  ".aws",
  ".azure",
  "AppData",
  "Windows",
  "ProgramData",
]
max_read_bytes = 16384
max_file_operation_bytes = 104857600
auto_approve_max_risk = 1
allowed_tools = [
  "get_current_time",
  "list_directory",
  "search_files",
  "read_text_file",
  "get_project_context",
  "search_project_memory",
  "get_recent_project_activity",
  "get_project_decision",
  "get_user_profile",
  "find_files",
  "open_file",
  "open_folder",
  "open_project",
  "start_application",
  "git_status",
  "git_log",
  "create_note",
  "copy_file",
  "move_file",
]
allowed_applications = ["C:\\Windows\\System32\\notepad.exe"]
allowed_domains = []
privileged_tools_enabled = false
remote_ai_enabled = false
visual_automation_enabled = false

[budgets]
max_steps_per_turn = 8
max_runtime_seconds = 120
max_modified_files = 5
max_outbound_bytes = 0
default_tool_timeout_seconds = 15

[logging]
level = "INFO"
# false: el texto de las conversaciones solo vive en memoria del proceso (para dar
# contexto al modelo) y no se guarda en SQLite; la auditoría registra las acciones
# sin el texto del usuario. true: se guardan mensajes e intención en claro.
# Cambiarlo no borra conversaciones guardadas antes.
store_conversation_content = false
store_tool_output = false

